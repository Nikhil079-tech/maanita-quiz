<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know Maanita Better 💖</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#ffe4ef,#e8ddff);color:#29233a}
.wrap{max-width:650px;margin:auto;padding:22px 15px 45px}.hero{background:#fff8fc;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 12px 35px #8b5cf633;margin-bottom:18px}
h1{margin:0 0 8px;font-size:30px}.sub{margin:0;color:#71677d}.card{background:#ffffffed;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #7c3aed12}
label{display:block;font-weight:700;margin-bottom:9px}.q{margin-bottom:20px}input,textarea{width:100%;padding:13px 14px;border:1px solid #ddd2e8;border-radius:13px;font-size:16px;outline:none;background:#fff}input:focus,textarea:focus{border-color:#c56aa6;box-shadow:0 0 0 3px #c56aa61a}textarea{min-height:90px;resize:vertical}.num{color:#b24c8b;margin-right:5px}
button{width:100%;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:800;color:white;background:linear-gradient(90deg,#d84c9a,#7d5ce6);box-shadow:0 8px 18px #7d5ce633;cursor:pointer}
.note{font-size:13px;text-align:center;color:#756b7e;margin-top:12px}
#result{display:none}.answer{background:#faf7fc;border-radius:14px;padding:13px;margin:9px 0}.answer b{display:block;font-size:13px;color:#9b4c84;margin-bottom:4px}.empty{color:#999}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div style="font-size:42px">💖</div>
    <h1>Know Maanita Better</h1>
    <p class="sub">25 little questions to know her a little more ✨</p>
  </section>

  <form id="quiz">
    <div class="card" id="questions"></div>
    <button type="submit">Submit Answers 💌</button>
    <p class="note">Your answers are saved in this browser on this device.</p>
  </form>

  <section class="card" id="result">
    <h2 style="margin-top:0">Maanita's Answers 💕</h2>
    <div id="answers"></div>
    <button type="button" onclick="window.print()" style="margin-top:12px">Save / Print Results 🖨️</button>
  </section>
</div>

<script>
const questions=[
"Full name","Nickname","Birth date 🎂","Favourite colour 🎨","Favourite food 🍕","Favourite drink 🥤",
"Favourite movie 🎬","Favourite song 🎵","Favourite singer 🎤","Favourite place 🌍","Favourite hobby 🎨",
"Favourite season 🌸","Favourite animal 🐶","Favourite subject 📚","Favourite person ❤️",
"Biggest dream ✨","Biggest fear 😶","One thing you dislike ❌","One thing that always makes you happy 😊",
"Best childhood memory 🥹","How many friends have you made? 👭","Who is your best friend? 💕",
"Your hidden talent 🌟","One thing you want to achieve in life 🚀",
"Tell me something about yourself that you think I should know ❤️"
];
const box=document.getElementById("questions");
questions.forEach((q,i)=>{
  const div=document.createElement("div"); div.className="q";
  const label=document.createElement("label"); label.innerHTML=`<span class="num">${i+1}.</span>${q}`;
  const input=document.createElement(i===24?"textarea":"input");
  input.name="q"+(i+1); input.placeholder="Type your answer...";
  if(i===2) input.type="date";
  div.append(label,input); box.append(div);
});
document.getElementById("quiz").addEventListener("submit",e=>{
 e.preventDefault();
 const data={}; questions.forEach((q,i)=>data[q]=document.querySelector(`[name="q${i+1}"]`).value.trim());
 localStorage.setItem("maanitaAnswers",JSON.stringify(data));
 showResults(data);
});
function showResults(data){
 document.getElementById("answers").innerHTML=questions.map(q=>`<div class="answer"><b>${q}</b>${data[q]||'<span class="empty">No answer</span>'}</div>`).join("");
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";
}
const saved=localStorage.getItem("maanitaAnswers");
if(saved) showResults(JSON.parse(saved));
</script>
</body>
</html>
